<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0B192C"/>
  <!-- Amber glow halo -->
  <rect width="64" height="64" rx="14" fill="url(#glow)" opacity="0.18"/>
  <!-- Open book icon -->
  <g stroke="none">
    <!-- Left page -->
    <path d="M8 18 C8 18 8 16 10 15 L28 12 C30 11.5 31 12.5 31 14 L31 46 C31 47.5 30 48 28 48.5 L10 51 C8 51.5 7 50.5 7 49 Z" fill="#f59e0b"/>
    <!-- Right page -->
    <path d="M56 18 C56 18 56 16 54 15 L36 12 C34 11.5 33 12.5 33 14 L33 46 C33 47.5 34 48 36 48.5 L54 51 C56 51.5 57 50.5 57 49 Z" fill="#fbbf24"/>
    <!-- Spine shadow left page -->
    <path d="M28 12.5 L28 48" stroke="#d97706" stroke-width="0.8" fill="none"/>
    <!-- Spine -->
    <rect x="30" y="12" width="4" height="36" rx="1" fill="#0B192C"/>
    <!-- Cross overlay on right page -->
    <rect x="43" y="22" width="3" height="18" rx="1" fill="#0B192C" opacity="0.35"/>
    <rect x="37" y="28" width="15" height="3" rx="1" fill="#0B192C" opacity="0.35"/>
  </g>
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </radialGradient>
  </defs>
</svg>
