# ─────────────────────────────────────────────────────────────────────────────
# SabAI Bible — GitHub Actions CI/CD
# Triggers: every push to main, and every Pull Request
#
# Required GitHub Secrets (Settings → Secrets → Actions → New repository secret):
#   VERCEL_TOKEN           – Vercel personal access token
#   VERCEL_ORG_ID          – from .vercel/project.json  (after vercel link)
#   VERCEL_PROJECT_ID      – from .vercel/project.json  (after vercel link)
#   VITE_SUPABASE_URL      – Supabase project URL
#   VITE_SUPABASE_ANON_KEY – Supabase anon/public key
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — SabAI Bible

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: sabai-bible
    # NOTE: deploy steps below override working-directory to repo root so that
    # root vercel.json (which includes /api serverless functions) is used.

jobs:
  # ── 1. Lint / Type-check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sabai-bible/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

  # ── 2. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sabai-bible/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sabai-bible/dist
          retention-days: 1

  # ── 3a. Deploy Preview (Pull Requests) ─────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        # Run from repo root — root vercel.json includes both sabai-bible/dist AND /api functions
        working-directory: .
        run: npm install -g vercel@latest

      - name: Deploy preview to Vercel
        # Must run from repo root so vercel.json at root is picked up (includes /api routes)
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --token="$VERCEL_TOKEN" --yes 2>&1 | tee /tmp/vercel.log
          echo "Preview URL: $(grep -o 'https://[^ ]*\.vercel\.app' /tmp/vercel.log | head -1)"

  # ── 3b. Deploy Production (push to main) ────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        working-directory: .
        run: npm install -g vercel@latest

      - name: Deploy production to Vercel
        # Must run from repo root so vercel.json at root is picked up (includes /api routes)
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --token="$VERCEL_TOKEN" --prod --yes 2>&1 | tee /tmp/vercel.log
          echo "Production URL: $(grep -o 'https://[^ ]*\.vercel\.app' /tmp/vercel.log | head -1)"
